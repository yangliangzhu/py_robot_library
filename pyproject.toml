[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-robot-library"
version = "0.2.0"
description = "Robot kinematics in Python: DH/MDH parameters, forward and inverse kinematics, and geometry utilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yangliangzhu", email = "3130104185@zju.edu.cn" }]
keywords = [
    "robotics",
    "kinematics",
    "inverse-kinematics",
    "forward-kinematics",
    "denavit-hartenberg",
    "manipulator",
    "casadi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "casadi>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://gitee.com/yangliangzhu_rob/py_robot_library"
Issues = "https://gitee.com/yangliangzhu_rob/py_robot_library/issues"

[tool.setuptools.packages.find]
include = ["model*", "tools*"]

[tool.setuptools.package-data]
"model.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Robot parameter tables are far more readable as dense matrices.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
